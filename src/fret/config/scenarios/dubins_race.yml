# Scenario SC-v11: Dubins dual-robot race (compact real-TB3 lab).
#
# Two agents race A → B on a 10 m × 10 m floor through narrow aisles.
# Agent 1: ARCO RRT* (blue).  Agent 2: ARCO SST (green).
#
# Pass criteria (releases.md V11-1):
#   pytest tests/scenario/test_dubins_race_e2e.py

/**:
  ros__parameters:
    scenario_id: "dubins_race"
    model: "dubins"
    backend: "mujoco"
    planning_config: planning/dubins.yml

    start_configuration: [1.2, 1.2, 0.785]
    goal_configuration: [8.8, 8.8, 0.0]

    planning_timeout: 20.0
    duration: 120.0
    race_timeout: 300.0
    simulation_dt: 0.05

    agents:
      rrt_star:
        algorithm: rrt_star
        label: "1"
        color: [0.267, 0.467, 0.800]
      sst:
        algorithm: sst
        label: "2"
        color: [0.267, 0.667, 0.400]

    recording:
      enabled: true
      topics:
        - /joint_states
