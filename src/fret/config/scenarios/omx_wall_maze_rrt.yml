# SC-v13d release variant — Γ-wall maze planned with ARCO RRT*.
#
# Same geometry / FSM / MPC tracking as omx_wall_maze.yml; only the transfer
# planner differs. Internal scenario_id stays omx_wall_maze so MJCF + maze
# rate limits resolve correctly.

/**:
  ros__parameters:
    model: open_manipulator_x
    scenario_id: omx_wall_maze
    showcase_id: omx_wall_maze_rrt
    simulation_dt: 0.02
    duration: 70.0
    planning_timeout: 30.0
    goal_tolerance: 0.05
    mjcf: mjcf/omx_wall_maze.xml
    pick_object: ball
    ball_radius_m: 0.020
    place_cone_height_m: 0.098
    place_cone_radius_m: 0.050
    grasp_mode: mujoco_adhesion
    planner_algorithm: rrt_star
    # Pinned under deterministic_planner_rng for mesh-clear retract+climb.
    planner_rng_seed: 204
    walls:
      -
        x_min: 0.23
        x_max: 0.31
        y_min: -0.11
        y_max: -0.09
        z_min: 0.0
        z_max: 0.22
      -
        x_min: 0.24
        x_max: 0.31
        y_min: -0.24
        y_max: -0.09
        z_min: 0.225
        z_max: 0.265
      -
        x_min: 0.23
        x_max: 0.31
        y_min: 0.09
        y_max: 0.11
        z_min: 0.0
        z_max: 0.22
      -
        x_min: 0.24
        x_max: 0.31
        y_min: 0.09
        y_max: 0.24
        z_min: 0.225
        z_max: 0.265
    wall_inflate_m: 0.03
    # Must match omx_wall_maze.yml — release variants are full YAML copies.
    mpc_cspace_clearance_rad: 0.28
    mpc_cspace_samples: 14000
    mpc_weight_obstacle: 120.0
    fault_on_wall_contact: true
    wall_contact_fault_steps: 5

    occupancy_density: 1200.0
    max_transfer_radius_m: 0.16
    min_transfer_ee_z_m: 0.10
    min_transfer_peak_ee_z_m: 0.21
    lift_height_m: 0.065
    phase_timeout_s: 60.0
    idle_configuration: [0.0, -1.05, 0.7, 0.7]
    retreat_configuration: [0.25, -1.05, 0.7, 0.7]
    pick_hover_configuration: [-1.0278, 0.6820, -0.5709, 0.5460]
    pick_grasp_configuration: [-1.0068, 0.8305, -0.5068, 0.4127]
    lift_hover_configuration: [-1.0068, 0.6306, -0.5976, 0.5636]
    place_hover_configuration: [-0.0121, 0.0403, -0.5344, 0.5144]
    place_grasp_configuration: [-0.0121, -0.0052, -0.1275, 0.5160]
    pick_xy: [0.180, -0.260]
    place_xy: [0.260, 0.000]
