# SC-v14b — OpenMANIPULATOR-Y ground pick-and-place.
#
# Pick: mushroom (Ø44 mm stem + Ø64 mm flange) on the floor; fang pinch under
# the flange gives form-closure carry (no kinematic latch). Side-entry approach
# avoids jamming pads on the flange. Place: wide tip-down cone funnel.
# Waypoints are actuator setpoints (physics sag compensated), not pure FK.

/**:
  ros__parameters:
    model: omy
    scenario_id: omy_pick_place
    simulation_dt: 0.02
    duration: 55.0
    planning_timeout: 60.0
    goal_tolerance: 0.12
    mjcf: mjcf/omy_pick_place.xml
    pick_object: ball
    ball_radius_m: 0.032
    place_cone_height_m: 0.280
    place_cone_radius_m: 0.140
    grasp_mode: pad_mid_carry
    lift_height_m: 0.080
    phase_timeout_s: 180.0
    # Pad-mid IK: side hover → under-flange open grasp → lift → place (overshoot Y).
    idle_configuration: [-0.2262, 1.0301, 1.2857, -0.0656, -0.1122, 0.5003]
    pick_hover_configuration: [-0.2262, 1.0301, 1.2857, -0.0656, -0.1122, 0.5003]
    pick_grasp_configuration: [0.0042, 0.959, 1.5527, 0.0117, -0.0009, 0.5]
    lift_hover_configuration: [0.0426, 0.5468, 1.7047, 0.0433, 0.0738, 0.4776]
    place_hover_configuration: [1.334, 0.5466, 1.7097, 0.0344, 0.0706, 0.4772]
    # Open at transfer hover — lowering into the cone slips the flange grasp.
    place_grasp_configuration: [1.334, 0.5466, 1.7097, 0.0344, 0.0706, 0.4772]
    retreat_configuration: [1.2256, 0.463, 1.6305, -0.0001, 0.0233, 0.4859]
    pick_xy: [0.40, -0.28]
    place_xy: [0.40, 0.28]
