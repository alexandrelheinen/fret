# SC-v16b — OpenMANIPULATOR-Y CV-driven floor pick-and-place (v1.4).
#
# Same geometry / FSM / pad-mid waypoints as SC-v14b (`omy_pick_place.yml`).
# Pick pose comes from gate-camera BallObservation; place stays YAML.
# Internal scenario_id stays omy_pick_place so MJCF resolve stays stable.
# pick_xy is a test oracle only — not grasp ground truth.

/**:
  ros__parameters:
    model: omy
    scenario_id: omy_pick_place
    showcase_id: omy_pick_place_cv
    simulation_dt: 0.02
    duration: 45.0
    planning_timeout: 30.0
    max_planner_attempts: 12
    goal_tolerance: 0.16
    mjcf: mjcf/omy_pick_place.xml
    pick_object: ball
    ball_radius_m: 0.043
    place_cone_height_m: 0.280
    place_cone_radius_m: 0.140
    grasp_mode: mujoco_adhesion
    use_vision: true
    vision_config: src/fret/config/vision/omy_portal_overhead.yml
    # Transfer plans around place-bin side shells (proximal arm collides in MJCF).
    planner_algorithm: rrt_star
    planner_rng_seed: 7
    prefer_transfer_detour: true
    occupancy_density: 800.0
    max_transfer_radius_m: 0.65
    min_transfer_ee_z_m: -0.15
    # Floor ball centre ~0.043 m; adhered lift settles near ~0.12 m pad mid.
    lift_height_m: 0.10
    phase_timeout_s: 45.0
    idle_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    pick_hover_configuration: [-0.2011, 0.6388, 2.1264, -0.2088, -0.8766, -0.0005]
    pick_grasp_configuration: [-0.1518, 0.8030, 2.1535, -0.0835, -0.7328, 0.0094]
    lift_hover_configuration: [-0.1588, 0.4894, 2.2404, -0.2132, -0.7513, -0.0234]
    # Tip-down place family: planner occupancy keeps the hover lateral; grasp
    # is lowered so the drop reads over the bin without link4 wall penetration.
    place_hover_configuration: [0.4000, 0.0500, 1.8000, -0.2575, -0.9997, -0.0128]
    place_grasp_configuration: [0.3925, 0.1169, 2.2925, -0.2279, -0.9607, -0.0389]
    retreat_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    # Retracted high via: lift→via→place chords clear the place-bin shell.
    transfer_detour_configuration: [-0.4055, -0.1107, 1.6389, -0.3941, -0.8320, -0.0193]
    transfer_via_configuration: [-0.4055, -0.1107, 1.6389, -0.3941, -0.8320, -0.0193]
    pick_xy: [0.350, -0.300]
    place_xy: [0.480, 0.000]
