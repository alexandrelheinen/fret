# SC-v13b — OpenMANIPULATOR-X pick-and-place (FSM + physical transfer).
#
# Stretched pedestals (~0.32 m fingertip radius, ~2.3× the early close-in
# layout): green → red under full MuJoCo physics (pads + adhesion).
# No obstacles (SC-v13c). AWS warehouse meshes are too large for the gripper.

/**:
  ros__parameters:
    model: open_manipulator_x
    scenario_id: omx_pick_place
    simulation_dt: 0.02
    duration: 25.0
    planning_timeout: 60.0
    goal_tolerance: 0.05
    mjcf: mjcf/omx_pick_place.xml
    pick_object: box
    box_half_size_m: 0.010
    grasp_mode: mujoco_adhesion
    idle_configuration: [0.0, -1.05, 0.7, 0.7]
    pick_hover_configuration: [-0.55, 0.35, -0.70, 0.20]
    pick_grasp_configuration: [-0.55, 0.70, -0.85, 0.20]
    place_hover_configuration: [0.55, 0.35, -0.70, 0.20]
    place_grasp_configuration: [0.55, 0.70, -0.85, 0.20]
    pick_xy: [0.273, -0.160]
    place_xy: [0.273, 0.160]
