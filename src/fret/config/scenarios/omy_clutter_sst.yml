# SC-v14c release variant — cluttered pick-place planned with ARCO SST.
#
# Same geometry / FSM / tracking as omy_clutter.yml; transfer planner differs.
# Internal scenario_id stays omy_clutter so MJCF + wall occupancy resolve correctly.

/**:
  ros__parameters:
    model: omy
    scenario_id: omy_clutter
    showcase_id: omy_clutter_sst
    simulation_dt: 0.02
    duration: 90.0
    planning_timeout: 30.0
    max_planner_attempts: 6
    goal_tolerance: 0.16
    mjcf: mjcf/omy_clutter.xml
    pick_object: ball
    ball_radius_m: 0.043
    place_cone_height_m: 0.280
    place_cone_radius_m: 0.140
    grasp_mode: mujoco_adhesion
    planner_algorithm: sst
    planner_rng_seed: 7
    prefer_transfer_detour: false
    wall_inflate_m: 0.01
    occupancy_density: 800.0
    max_transfer_radius_m: 0.65
    min_transfer_ee_z_m: -0.15
    lift_height_m: 0.10
    phase_timeout_s: 45.0
    idle_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    pick_hover_configuration: [-0.0915, 0.7380, 1.9571, -0.2570, -0.7303, -0.0000]
