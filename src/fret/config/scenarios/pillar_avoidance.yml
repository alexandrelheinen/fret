# Scenario SC-02: Pillar Avoidance (Milestone 5)
#
# Two cylindrical pillars stand in the SCARA horizontal workspace.
# The arm must plan and execute a collision-free path at constant z
# (q3 = 0.10 m) from the home configuration to a goal configuration,
# avoiding both pillars.
#
# Pillars (world frame, static):
#   pillar_a: centre (0.25, 0.10, 0.20), radius 0.04 m, height 0.40 m
#   pillar_b: centre (-0.15, 0.30, 0.20), radius 0.04 m, height 0.40 m
#
# Pass criteria:
#   - Planner returns SUCCESS within 30 s.
#   - No planned waypoint's EE position is within 0.05 m of either pillar
#     surface (horizontal clearance > 0.09 m from pillar centres).
#   - EE tracking error < 5 mm at all times.
#   - No fault published on /controller_fault.
#
# See MILESTONES.md Milestone 5 for full acceptance criteria.

/**:
  ros__parameters:
    scenario_id: "pillar_avoidance"

    # Gazebo world file (relative to share/fret/).
    world_file: "worlds/pillar_scenario.sdf"

    # Start joint configuration [rad, rad, m] — arm at rest (fully extended).
    start_configuration: [0.0, 0.0, 0.10]

    # Goal joint configuration [rad, rad, m].
    # FK: EE ≈ (0.417, -0.405, 0.138) m — opposite quadrant from both pillars.
    goal_configuration: [-1.0, 0.5, 0.10]

    # Constant prismatic extension q3 [m] throughout the trajectory (constant z).
    fixed_q3: 0.10

    # Maximum planning time [s].
    planning_timeout: 30.0

    # Simulation duration [s].
    duration: 20.0

    # Minimum horizontal clearance from each pillar surface required [m].
    # Any waypoint within pillar_radius + min_clearance = 0.04 + 0.05 = 0.09 m
    # of a pillar centre triggers a collision violation.
    min_pillar_clearance: 0.05

    # ROS bag recording.
    recording:
      enabled: true
      topics:
        - /joint_states
        - /joint_commands
        - /joint_trajectory
        - /obstacle_cloud

    # Obstacle definitions (mirrors perception.yaml pillar entries).
    # Format: [x, y, z_centre, radius]
    pillar_centres:
      - [0.25, 0.10, 0.20, 0.04]   # pillar_a
      - [-0.15, 0.30, 0.20, 0.04]  # pillar_b
