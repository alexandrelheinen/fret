# SC-v20d — SO-101 pick-and-place through a dual Γ (friction grasp).
#
# Same ball, bin, and release segment as SC-v20b. The walls are the two Γ
# obstacles in mjcf/so101_wall_maze.xml. The straight lift-to-place swing
# hits the pick-side cap; plan_to_segment has to back out and climb.

/**:
  ros__parameters:
    model: so101
    scenario_id: so101_wall_maze
    simulation_dt: 0.02
    duration: 55.0
    phase_timeout_s: 60.0
    planning_timeout: 60.0
    goal_tolerance: 0.05
    mjcf: mjcf/so101_wall_maze.xml
    pick_object: ball
    ball_radius_m: 0.020
    place_cone_height_m: 0.098
    place_cone_radius_m: 0.060
    grasp_mode: friction
    use_vision: false
    # Start and finish on the pick side. The folded idle of SC-v20b swings
    # through the pick-side cap.
    idle_configuration: [0.5794, -0.1921, -0.1273, 1.6542, -1.1914]
    retreat_configuration: [0.5794, -0.1921, -0.1273, 1.6542, -1.1914]
    pick_hover_configuration: [0.6390, -0.0816, 0.0847, 1.6581, 0.0512]
    pick_grasp_configuration: [0.6388, -0.0399, 0.4973, 1.0366, 0.0508]
    lift_hover_configuration: [0.5794, -0.1921, -0.1273, 1.6542, -1.1914]
    lift_height_m: 0.08
    # Place is a vertical segment above the basket centre, not one joint
    # pose. The segment starts place_release_clearance_m above the rim and
    # runs upward for place_release_segment_m. The runner plans to any point
    # on that segment and releases there. The joint vectors below are unused
    # seeds kept so older readers still see a 5-vector.
    place_release_clearance_m: 0.06
    place_release_segment_m: 0.10
    place_segment_tolerance_m: 0.005
    place_arm_margin_m: 0.025
    planner_rng_seed: 7
    # Dual Γ, same AABBs as the transfer_wall_* geoms.
    walls:
      -
        x_min: 0.17
        x_max: 0.25
        y_min: 0.0
        y_max: 0.018
        z_min: 0.0
        z_max: 0.16
      -
        x_min: 0.16
        x_max: 0.25
        y_min: -0.03
        y_max: 0.0
        z_min: 0.19
        z_max: 0.24
      -
        x_min: 0.17
        x_max: 0.25
        y_min: 0.15
        y_max: 0.172
        z_min: 0.0
        z_max: 0.15
      -
        x_min: 0.16
        x_max: 0.25
        y_min: 0.172
        y_max: 0.23
        z_min: 0.155
        z_max: 0.215
    place_hover_configuration: [-0.9237, -0.2520, 0.1023, 1.4335, -1.2533]
    place_grasp_configuration: [-0.9237, -0.2520, 0.1023, 1.4335, -1.2533]
    pick_xy: [0.200, -0.120]
    place_xy: [0.200, 0.080]
