# SC-v14c — OpenMANIPULATOR-Y cluttered floor pick-and-place (front cone).
#
# Mid-cell wall blocks the straight transfer; ARCO RRT* plans the detour.
# Release planner variants (same geometry, RRT* vs SST transfer plan):
#   omy_clutter_rrt.yml
#   omy_clutter_sst.yml

/**:
  ros__parameters:
    model: omy
    scenario_id: omy_clutter
    simulation_dt: 0.02
    duration: 90.0
    planning_timeout: 30.0
    max_planner_attempts: 6
    goal_tolerance: 0.16
    mjcf: mjcf/omy_clutter.xml
    pick_object: ball
    ball_radius_m: 0.043
    place_cone_height_m: 0.280
    place_cone_radius_m: 0.140
    grasp_mode: mujoco_adhesion
    planner_algorithm: rrt_star
    # seed_offset=0 → mesh-clear retract with wall FAULT honesty (v1.4.1).
    planner_rng_seed: 6
    prefer_transfer_detour: true
    # AABB of transfer_wall_a (18 cm tall, thinner stub — still LOS-blocking).
    walls:
      - x_min: 0.365
        x_max: 0.465
        y_min: -0.145
        y_max: -0.095
        z_max: 0.18
    wall_inflate_m: 0.01
    mpc_cspace_clearance_rad: 0.28
    mpc_cspace_samples: 14000
    mpc_weight_obstacle: 180.0
    fault_on_wall_contact: true
    # Longer debounce than OM-X: OMY transfer grazes more under SST variance.
    wall_contact_fault_steps: 20
    occupancy_density: 800.0
    max_transfer_radius_m: 0.65
    min_transfer_ee_z_m: -0.15
    # Floor ball centre ~0.043 m; adhered lift settles near ~0.12 m pad mid.
    lift_height_m: 0.10
    phase_timeout_s: 45.0
    idle_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    pick_hover_configuration: [-0.2011, 0.6388, 2.1264, -0.2088, -0.8766, -0.0005]
    pick_grasp_configuration: [-0.1518, 0.8030, 2.1535, -0.0835, -0.7328, 0.0094]
    lift_hover_configuration: [-0.1588, 0.4894, 2.2404, -0.2132, -0.7513, -0.0234]
    # Tip-down place family raised/retracted so link4 clears colliding bin walls.
    place_hover_configuration: [0.4000, 0.0000, 1.8000, -0.2575, -0.9997, -0.0128]
    place_grasp_configuration: [0.4000, 0.0500, 2.0500, -0.2575, -0.9997, -0.0128]
    retreat_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    # Retracted high via clears place-bin shell (old mid-cell via collides).
    transfer_detour_configuration: [-0.4055, -0.1107, 1.6389, -0.3941, -0.8320, -0.0193]
    pick_xy: [0.350, -0.300]
    place_xy: [0.480, 0.000]
