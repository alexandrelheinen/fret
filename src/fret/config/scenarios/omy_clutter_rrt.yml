# SC-v14c release variant — cluttered pick-place planned with ARCO RRT*.
#
# Same geometry / FSM / tracking as omy_clutter.yml; transfer planner differs.
# Internal scenario_id stays omy_clutter so MJCF + wall occupancy resolve correctly.

/**:
  ros__parameters:
    model: omy
    scenario_id: omy_clutter
    showcase_id: omy_clutter_rrt
    simulation_dt: 0.02
    duration: 90.0
    planning_timeout: 30.0
    max_planner_attempts: 6
    goal_tolerance: 0.16
    mjcf: mjcf/omy_clutter.xml
    pick_object: ball
    ball_radius_m: 0.043
    place_cone_height_m: 0.280
    place_cone_radius_m: 0.140
    grasp_mode: mujoco_adhesion
    planner_algorithm: rrt_star
    # seed_offset=0 → mesh-clear retract with wall FAULT honesty (v1.4.1).
    planner_rng_seed: 6
    # Release variants must exercise the named planner (not the YAML detour).
    prefer_transfer_detour: false
    # AABB of transfer_wall_a — must match omy_clutter.yml / MJCF.
    walls:
      - x_min: 0.365
        x_max: 0.465
        y_min: -0.145
        y_max: -0.095
        z_max: 0.18
    wall_inflate_m: 0.01
    # Must match omy_clutter.yml — release variants are full YAML copies.
    mpc_cspace_clearance_rad: 0.28
    mpc_cspace_samples: 14000
    mpc_weight_obstacle: 180.0
    fault_on_wall_contact: true
    wall_contact_fault_steps: 20
    occupancy_density: 800.0
    max_transfer_radius_m: 0.65
    min_transfer_ee_z_m: -0.15
    lift_height_m: 0.10
    phase_timeout_s: 45.0
    idle_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    pick_hover_configuration: [-0.2011, 0.6388, 2.1264, -0.2088, -0.8766, -0.0005]
    pick_grasp_configuration: [-0.1518, 0.8030, 2.1535, -0.0835, -0.7328, 0.0094]
    lift_hover_configuration: [-0.1588, 0.4894, 2.2404, -0.2132, -0.7513, -0.0234]
    place_hover_configuration: [0.4304, 0.3638, 1.4970, -0.1607, -0.9983, 0.0291]
    place_grasp_configuration: [0.4238, 0.3699, 1.8269, -0.2693, -1.0145, -0.0051]
    retreat_configuration: [0.7506, -0.8762, 1.7473, 0.3442, 1.4352, 0.0001]
    transfer_detour_configuration: [0.1568, 0.2551, 2.2177, -0.3336, -0.9252, -0.0427]
    pick_xy: [0.350, -0.300]
    place_xy: [0.480, 0.000]
