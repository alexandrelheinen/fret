# Perception pipeline configuration for the ARCO-FRET SITL scenario.
#
# obstacle definitions used by perception_bridge.py.
# Each obstacle entry is matched against the Gazebo entity name (which
# becomes a TF frame id after ros_gz_bridge translates
# /world/<world>/pose/info → /tf).
#
# Fields:
#   name        : Gazebo model name (= TF child_frame_id)
#   dimensions  : full bounding-box extent [dx, dy, dz] in metres
#   samples     : number of uniform random points to generate per tick
#                 TODO: replace uniform sampling with MCMC
#                 See https://alexandrelheinen.github.io/articles/2026-03-02-mcmc/

perception:
  # CloudFilter settings
  floor_z: 0.0
  floor_margin: 0.01      # discard points with z <= floor_z + floor_margin
  min_range: 0.01         # discard points closer than this (m)
  max_range: 5.0          # discard points farther than this (m)

  # Occupancy model
  inflation_radius: 0.05  # obstacle inflation for collision margin (m)

  # Random sampling reproducibility seed
  rng_seed: 42

  # Obstacle definitions (must match arco_scenario.sdf model names)
  obstacles:
    - name: obstacle_box_a
      dimensions: [0.10, 0.10, 0.10]   # centre block
      samples: 80
    - name: obstacle_box_b
      dimensions: [0.10, 0.10, 0.10]   # left block
      samples: 80
    - name: obstacle_box_c
      dimensions: [0.10, 0.10, 0.10]   # right block
      samples: 80
