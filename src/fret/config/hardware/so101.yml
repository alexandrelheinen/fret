# SO-101 hardware bridge thresholds (FR-SYS-04).
robot: so101
baud_rate: 1000000
update_rate_hz: 50.0
cycle_budget_ms: 20.0
overrun_warn_consecutive: 3
connect_range_margin_rad: 0.15
reply_timeout_s: 0.05
reconnect_backoff_s: 0.5
max_joint_velocity: 2.0
command_timeout_s: 0.2
max_dt_s: 0.05
velocity_source: present_speed  # or finite_difference
joint_names:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper
servo_ids: [1, 2, 3, 4, 5, 6]
expected_model_number: 777
safety:
  watchdog_s: 0.1
  enable_lease_s: 0.5
  limit_margin_rad: 0.03
  max_joint_velocity: 2.0
  dt_s: 0.02
  fault_failed_cycles: 5
  ease_in_speed_rad_s: 0.3
  out_of_limit_refuse_margin_rad: 0.15
  torque_limit: 1000
  protection_current: 500
  max_temperature: 70
