# Dubins race column forest (SC-v11 / T11-02).
#
# Expanded 80 m × 80 m warehouse floor for ~30 s real-time showcase races.
# Dense staggered circular columns (3 m row pitch) with deliberate corridor
# gaps so RRT* and SST choose visibly different routes:
#   - South lane (y ≤ 12) and north lane (y ≥ 58)
#   - West-north / east-south arcs around the blocked diagonal band
#   - Mid-field weave gaps near (40, 40)
# The main diagonal (y ≈ x) is walled between x ≈ 16–68 to prevent a shared
# straight-line plan.
#
# Column format: {x, y, radius, height} — planning uses (x, y) centres.

workspace_bounds:
  x: [0.0, 80.0]
  y: [0.0, 80.0]
  z: [0.0, 4.0]

start_xy: [6.0, 6.0]
goal_xy: [74.0, 74.0]

# Agent spawn offsets perpendicular to the start heading (m).
agent_lateral_offset: 0.8

vehicle:
  radius: 0.42
  clearance_margin: 0.28

planner:
  bounds:
    - [0.0, 80.0]
    - [0.0, 80.0]
  rrt_max_sample_count: 6000
  sst_max_sample_count: 6000
  step_size: 0.45
  goal_tolerance: 0.65
  collision_check_count: 10
  goal_bias: 0.10
  witness_radius: 0.25
  enable_pruning: true

