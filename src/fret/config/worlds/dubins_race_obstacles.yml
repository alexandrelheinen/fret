    - [0.0, 80.0]
    - [0.0, 80.0]
  rrt_max_sample_count: 6000
  sst_max_sample_count: 6000
  step_size: 0.45
  goal_tolerance: 0.65
  collision_check_count: 10
  goal_bias: 0.10
  witness_radius: 0.25
  enable_pruning: true

