# Dubins race column forest (SC-v11 / T11-02).
#
# Expanded 80 m × 80 m warehouse floor for ~30 s real-time showcase races.
# Staggered circular columns — multiple corridors from A to B, not a maze.
#
# Column format: {x, y, radius, height} — planning uses (x, y) centres.

workspace_bounds:
  x: [0.0, 80.0]
  y: [0.0, 80.0]
  z: [0.0, 4.0]

start_xy: [6.0, 6.0]
goal_xy: [74.0, 74.0]

# Agent spawn offsets perpendicular to the start heading (m).
agent_lateral_offset: 0.8

vehicle:
  radius: 0.42
  clearance_margin: 0.28

planner:
  bounds:
    - [0.0, 80.0]
    - [0.0, 80.0]
  rrt_max_sample_count: 6000
  sst_max_sample_count: 6000
  step_size: 0.45
  goal_tolerance: 0.65
  collision_check_count: 10
  goal_bias: 0.10
  witness_radius: 0.25
  enable_pruning: true

columns:
  # South-west approach — keep a wide lane near y ≈ 6
  - {x: 16.0, y: 10.0, radius: 0.50, height: 2.6}
  - {x: 24.0, y: 14.0, radius: 0.50, height: 3.0}
  - {x: 32.0, y: 12.0, radius: 0.48, height: 2.4}

  # Lower-mid weave
  - {x: 20.0, y: 24.0, radius: 0.50, height: 3.2}
  - {x: 34.0, y: 28.0, radius: 0.50, height: 2.8}
  - {x: 44.0, y: 18.0, radius: 0.50, height: 3.4}

  # Central band — gaps near (40, 40)
  - {x: 38.0, y: 36.0, radius: 0.50, height: 2.5}
  - {x: 48.0, y: 42.0, radius: 0.50, height: 3.0}
  - {x: 52.0, y: 30.0, radius: 0.48, height: 2.7}

  # Upper-mid diagonal options
  - {x: 46.0, y: 54.0, radius: 0.50, height: 3.1}
  - {x: 58.0, y: 48.0, radius: 0.50, height: 2.9}
  - {x: 62.0, y: 36.0, radius: 0.50, height: 3.3}

  # North-east approach — open corner near goal
  - {x: 56.0, y: 62.0, radius: 0.50, height: 2.6}
  - {x: 66.0, y: 58.0, radius: 0.50, height: 3.0}
  - {x: 70.0, y: 68.0, radius: 0.48, height: 2.8}
