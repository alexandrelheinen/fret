# Dubins race structure forest (SC-v11 / T11-02).
#
# Expanded 80 m × 80 m warehouse floor for ~30 s real-time showcase races.
# Rectangular posts/walls along the A→B corridor plus a few U-shaped dead-end
# alcoves that tempt greedy shortcuts but are avoidable with proper planning.
#
# Structure format: {x, y, hx, hy, height} — centre + half-extents (metres).

workspace_bounds:
  x: [0.0, 80.0]
  y: [0.0, 80.0]
  z: [0.0, 4.0]

start_xy: [6.0, 6.0]
goal_xy: [74.0, 74.0]

agent_lateral_offset: 0.8

vehicle:
  radius: 0.42
  clearance_margin: 0.28

planner:
