# PPP warehouse static obstacles — MJCF 1:5 preview scale (SC-v10 / T10-08).
#
# Box bounds match perception_ppp_warehouse.yaml and mjcf/ppp_warehouse.xml:
#   X [0, 12] m, Y [0, 5] m, Z [0, 3] m.
#
# Back-wall racks and the visual wall were removed from the preview scene to
# open sightlines and give the gantry more lateral clearance.
#
# Box format: [x_min, y_min, z_min, x_max, y_max, z_max]

workspace_bounds:
  x: [0.0, 12.0]
  y: [0.0, 5.0]
  z: [0.0, 3.0]

obstacles:
  - [3.2, 0.6, 0.0, 4.8, 1.8, 1.2]
  - [6.3, 3.3, 0.0, 7.7, 4.7, 1.0]
  - [7.4, 0.5, 0.0, 8.6, 1.5, 1.8]
  # Mid-field tall rack — with obs_c forces an S-shaped cruise around both.
  - [5.2, 2.0, 0.0, 6.8, 3.2, 2.3]
