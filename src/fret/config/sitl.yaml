# FRET SITL Demo Profile Configuration
#
# This file provides default parameter overrides for the full SITL pipeline
# launched by ``ros2 launch fret sitl.py``.
#
# ── Planner ────────────────────────────────────────────────────────────────
# Settings here mirror the keys in planner.yaml; they exist so that the SITL
# demo can use a deterministic seed and faster convergence without permanently
# changing the library defaults.
#
# Non-SI exemption: all angular values below are in radians as required by
# the ARCO integration contract.

sitl:
  # Scenario profile loaded by sitl.py (must match a <name>.py in launch/)
  scenario: arco_scenario

  # ── Planner profile ────────────────────────────────────────────────────
  planner:
    # Algorithm used for the SITL demo run.
    algorithm: rrt_connect

    # Fixed RNG seed for fully reproducible planning paths.
    # Override with ~ (null) for non-deterministic production use.
    rng_seed: 42

    # Planning timeout in seconds for the demo run.
    timeout: 10.0

    rrt_connect:
      # Smaller step → finer collision resolution around the gate obstacles.
      step_size: 0.04

      # Sufficient iterations for the UR3 gate-passage scenario.
      max_iterations: 15000

      # Moderate goal bias: balances speed vs. path quality.
      goal_bias: 0.10

  # ── Replanning profile ─────────────────────────────────────────────────
  replanning:
    # Debounce: minimum seconds between successive replan calls.
    min_replan_interval: 1.5

    # Raise PATH_INVALIDATED when ≥ 15 % of waypoints are blocked.
    path_invalidation_ratio: 0.15

    # Raise TRACKING_ERROR when joint RMS error exceeds 0.15 rad sustained
    # for 0.5 s.
    tracking_error_threshold: 0.15
    tracking_error_window: 0.5

    # Raise OCCUPANCY_CHANGE when the scene point count shifts by ≥ 8 %.
    occupancy_change_ratio: 0.08

    # After a planning failure, wait 3 s before retrying.
    fallback_cooldown: 3.0

  # ── Bag recording ──────────────────────────────────────────────────────
  # These are documentation defaults; the actual runtime values are
  # controlled by ``record_bag`` and ``bag_dir`` launch arguments.
  bag:
    # Topics captured during a bag-recorded run.
    topics:
      - /joint_states
      - /clock
      - /tf
      - /tf_static
