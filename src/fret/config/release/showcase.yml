# Release showcase matrix (v1.2.3+).
#
# Camera policy:
#   * overview — required for EVERY scenario (frame robots + start/goal).
#   * follow   — optional for mobile robots (split-screen chase). Omitted from
#     the Dubins release job so encode stays under ~10 min CI budget; render
#     locally with scripts/video.sh --camera follow when needed.
#     Static/tabletop arms must NOT export follow on release.
#
# Per-scenario overrides (optional):
#   * fps              — encode frame rate (default: top-level fps)
#   * width / height   — encode resolution (default: top-level)
#   * clip_duration_s  — fixed video length (s); full race + hold/trim to fit
#   * clip_scale       — video length = scale × sim_time (hold if scale > 1)
#                        Mutually exclusive with clip_duration_s.
#
# Static release focus:
#   * OM-X SC-v13d Γ-wall maze — RRT* vs SST (v1.2.3)
#   * OMY pick-place (SC-v14b / SC-v16b CV path) + SC-v14c clutter RRT* vs SST
#
# v1.4: OMY pick-place runners default use_vision=True (gate cams → pick IK).
# Showcase id stays omy_pick_place so R2 clip names remain stable; SC-v16b
# alias is config/scenarios/omy_pick_place_cv.yml for tests / explicit CV runs.
#
# Post-v1.4.0 showcase refresh:
#   * All arm cells use floor balls (no pick pedestals).
#   * Overview may show a red transparent CV ghost at the vision pose.
#   * Side clips ``*_gate_cam_{left,right}.mp4`` (low-FPS, circle+pose text)
#     are written next to overview and uploaded to the same R2 folder.
#     Not composited into overview (no subwindows).
#
# Regenerate clips via scripts/release/render_showcase.py or release.yml.

fps: 30
width: 1280
height: 720

scenarios:
  - id: dubins_race
    model: dubins
    robot_class: mobile
    cameras: [overview]
    # Full race (~38 s) + short hold → fixed 40 s video.
    # 960×540 @ 20 fps = 800 frames; keeps encode << 10 min.
    fps: 20
    width: 960
    height: 540
    clip_duration_s: 40.0
    physics_mode: true
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: dubins_race_timing.json
    primary_video: dubins_race_overview.mp4

  - id: omx_wall_maze_rrt
    model: open_manipulator_x
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omx_wall_maze_rrt_timing.json
    primary_video: omx_wall_maze_rrt_overview.mp4

  - id: omx_wall_maze_sst
    model: open_manipulator_x
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: omx_wall_maze_sst_timing.json
    primary_video: omx_wall_maze_sst_overview.mp4

  - id: omy_pick_place
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omy_pick_place_timing.json
    primary_video: omy_pick_place_overview.mp4

  - id: omy_clutter_rrt
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omy_clutter_rrt_timing.json
    primary_video: omy_clutter_rrt_overview.mp4

  - id: omy_clutter_sst
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: omy_clutter_sst_timing.json
    primary_video: omy_clutter_sst_overview.mp4
