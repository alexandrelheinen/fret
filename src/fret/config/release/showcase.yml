# Release showcase matrix (v1.2.3+).
#
# Camera policy:
#   * overview — isometric top view for EVERY scenario (frame robots +
#     start/goal). Tune zoom/azimuth per MJCF / runtime camera constants.
#   * follow   — required for mobile robots only (split-screen chase).
#     Static/tabletop arms must NOT export follow on release.
#
# Static release focus:
#   * OM-X SC-v13d Γ-wall maze — RRT* vs SST (v1.2.3)
#   * OMY SC-v14b pick-place + SC-v14c clutter RRT* vs SST (v1.2.4)
#
# Regenerate clips via scripts/release/render_showcase.py or release.yml.

fps: 30
width: 1280
height: 720

scenarios:
  - id: dubins_race
    model: dubins
    robot_class: mobile
    cameras: [overview, follow]
    physics_mode: true
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: dubins_race_timing.json
    primary_video: dubins_race_overview.mp4

  - id: omx_wall_maze_rrt
    model: open_manipulator_x
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omx_wall_maze_rrt_timing.json
    primary_video: omx_wall_maze_rrt_overview.mp4

  - id: omx_wall_maze_sst
    model: open_manipulator_x
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: omx_wall_maze_sst_timing.json
    primary_video: omx_wall_maze_sst_overview.mp4

  - id: omy_pick_place
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omy_pick_place_timing.json
    primary_video: omy_pick_place_overview.mp4

  - id: omy_clutter_rrt
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: rrt_star
    collision_backend: mujoco
    timing_file: omy_clutter_rrt_timing.json
    primary_video: omy_clutter_rrt_overview.mp4

  - id: omy_clutter_sst
    model: omy
    robot_class: static
    cameras: [overview]
    physics_mode: false
    planner_algorithm: sst
    collision_backend: mujoco
    timing_file: omy_clutter_sst_timing.json
    primary_video: omy_clutter_sst_overview.mp4
