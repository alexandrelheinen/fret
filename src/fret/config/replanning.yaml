replanning:
  # ---------------------------------------------------------------------------
  # Global debounce
  # ---------------------------------------------------------------------------

  # Minimum time (seconds) between two successive replan calls.
  # Prevents uncontrolled oscillation when triggers arrive faster than
  # the planner can respond.
  min_replan_interval: 1.0

  # ---------------------------------------------------------------------------
  # Path-invalidation trigger
  # ---------------------------------------------------------------------------

  # Fraction of active-path waypoints that must be blocked by the new
  # occupancy snapshot before a PATH_INVALIDATED trigger is raised.
  # Range: (0.0, 1.0]  —  lower values are more sensitive to scene changes.
  path_invalidation_ratio: 0.10

  # ---------------------------------------------------------------------------
  # Tracking-error trigger (hysteresis)
  # ---------------------------------------------------------------------------

  # RMS joint-space tracking error (rad for revolute, m for prismatic) that,
  # when sustained over tracking_error_window, raises a TRACKING_ERROR trigger.
  tracking_error_threshold: 0.15

  # Duration (seconds) for which the tracking error must continuously exceed
  # tracking_error_threshold before the trigger fires.  Acts as a hysteresis
  # window to reject momentary noise.
  tracking_error_window: 0.5

  # ---------------------------------------------------------------------------
  # Occupancy-change trigger
  # ---------------------------------------------------------------------------

  # Fraction of occupancy point count that must change between two consecutive
  # snapshots before an OCCUPANCY_CHANGE trigger is raised.
  # Range: (0.0, 1.0]  —  lower values are more sensitive to minor updates.
  occupancy_change_ratio: 0.05

  # ---------------------------------------------------------------------------
  # Fallback cooldown
  # ---------------------------------------------------------------------------

  # Time (seconds) the manager remains in FALLBACK before another replan
  # attempt is allowed.  Prevents repeated immediate retries after failures.
  fallback_cooldown: 2.0
