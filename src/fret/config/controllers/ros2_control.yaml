# ros2_control controller configuration for the SCARA SITL.
#
# Loaded by the gz_ros2_control plugin at Gazebo startup.
# Spawned controllers: joint_state_broadcaster, joint_group_velocity_controller.

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz — matches the 50 Hz controller loop in controller_node.py

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# Publish joint positions and velocities on /joint_states.
joint_state_broadcaster:
  ros__parameters: {}

# Receive velocity set-points on /joint_group_velocity_controller/commands
# (remapped to /joint_commands by the sitl.py launch file).
joint_group_velocity_controller:
  ros__parameters:
    joints:
      - joint_arm_0
      - joint_arm_1
      - joint_extension
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
