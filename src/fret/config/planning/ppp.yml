# PPP warehouse planning parameters (v1.0).
#
# Consumed by: ppp_warehouse_runner, planner_node, cspace checkers.

obstacle_file: worlds/ppp_warehouse_preview_obstacles.yml

# Safety margin subtracted from obstacle clearance during planning [m].
contact_radius: 0.015

# Surface samples along each box edge for occupancy point clouds.
samples_per_edge: 4

# Acceptance threshold for EE tracking error in E2E validation [m].
ee_error_limit_m: 0.010

# Physics SITL tracking limit [m] — kinematic limit × Dubins RTF ratio, capped at
# grasp goal_radius (magnetic place tolerance) when actuator lag dominates.
ee_error_limit_physics_m: 0.55

# Reference Dubins kinematic→physics slowdown used to scale PPP physics gates.
dubins_physics_rtf_ratio: 1.73

# MJCF cargo body offset from the EE along Z [m] (see ppp_warehouse.xml).
cargo_ee_offset_z: -0.34

cruise:
  nominal_min_z: 1.5
  default_z: 2.2
  physics_min_z: 2.0
  flyover_clearance_m: 0.05
  obstacle_clearance_m: 0.35

tracking:
  goal_tolerance: 0.02
  physics_goal_tolerance: 0.05

trajectory_generator:
  max_interp_step_m: 0.004
