# TrajectoryConverter configuration.
#
# These parameters control the time-parameterization of joint-space paths
# produced by the ARCO planner.

trajectory:
  # Output sample rate [Hz].  Must match the controller update rate.
  control_hz: 50.0

  # Per-joint maximum velocity [rad/s for revolute, m/s for prismatic].
  # Order: [joint_arm_0, joint_arm_1, joint_extension]
  v_max: [1.5, 1.5, 0.1]

  # Per-joint maximum acceleration [rad/s² for revolute, m/s² for prismatic].
  a_max: [2.0, 2.0, 0.2]

  # Minimum segment duration [s].  Prevents zero-time segments for
  # identical consecutive waypoints.
  dt_min: 0.02
