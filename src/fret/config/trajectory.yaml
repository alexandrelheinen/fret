# ARCO-FRET Trajectory Conversion Configuration
#
# Defines default kinematic limits and timing parameters for
# TrajectoryConverter.  Override individual keys by passing a config dict
# to TrajectoryConverter.__init__() to tune per-instance behaviour.
#
# See docs/arco/issue-06-trajectory-conversion-and-controller-handover.md
# for the full specification and acceptance criteria.

trajectory:
  # -----------------------------------------------------------------------
  # Kinematic limits
  # -----------------------------------------------------------------------

  # Per-joint maximum velocity (rad/s for revolute joints, m/s for prismatic).
  # A scalar value is broadcast to all joints.
  # A list overrides each joint individually and must match the robot DOF.
  max_velocity: 1.0

  # Per-joint maximum acceleration (rad/s² for revolute, m/s² for prismatic).
  # Same scalar-or-list semantics as max_velocity.
  max_acceleration: 2.0

  # -----------------------------------------------------------------------
  # Timing parameters
  # -----------------------------------------------------------------------

  # Minimum segment duration (seconds).  Any inter-waypoint segment whose
  # trapezoidal time falls below this threshold is clamped to this value,
  # preventing numerical instability for near-zero displacements.
  min_segment_time: 0.001

  # Recommended controller command update rate (Hz).  Reported verbatim in
  # TrajectoryResult.command_rate_hz for downstream controller consumers.
  # The controller must publish commands at least this frequently for
  # adequate trajectory tracking.
  command_rate_hz: 100.0
