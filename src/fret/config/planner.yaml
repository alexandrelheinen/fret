# ARCO-FRET Planner Configuration
#
# This file defines default parameters for the PlannerAdapter and all
# bundled planner implementations.  Override individual keys in the
# planner_config field of a PlanningRequest to tune per-request.
#
# See docs/arco/issue-05-arco-planner-adapter-in-fret.md for the full
# specification and acceptance criteria.

planner:
  # -----------------------------------------------------------------------
  # Adapter-level settings
  # -----------------------------------------------------------------------

  # Default algorithm used when planner_config.algorithm is not supplied.
  algorithm: rrt_connect

  # Default planning timeout in seconds (used when PlanningRequest.timeout
  # is not supplied by the caller).
  default_timeout: 5.0

  # Maximum age of the occupancy snapshot in seconds.  Planning requests
  # with an occupancy_stamp older than this threshold are rejected with
  # status "invalid_request" and failure_reason containing "stale_occupancy".
  # Default matches the contract spec (docs/arco/spec-integration-contract.md
  # Section 5).
  max_occupancy_age: 2.0

  # -----------------------------------------------------------------------
  # RRT-Connect parameters
  # -----------------------------------------------------------------------
  rrt_connect:
    # Maximum extension step in the joint-space Euclidean norm.
    # Revolute joints: radians.  Prismatic joints: meters.
    # Smaller values give finer collision resolution at the cost of more
    # tree nodes.
    step_size: 0.05

    # Upper bound on the number of RRT-Connect iterations.  Each iteration
    # performs one EXTEND and one CONNECT call.  Increase for difficult
    # narrow-passage scenes at the cost of longer worst-case solve time.
    max_iterations: 10000

    # Goal-bias probability: fraction of iterations that sample the goal
    # configuration instead of a uniformly random configuration.  Values
    # in [0.05, 0.20] are typical; higher values speed up planning in
    # open spaces but may miss narrow passages.
    goal_bias: 0.10

    # Integer seed for the internal random-number generator.
    # Set to a fixed integer for deterministic, reproducible planning runs
    # (e.g. regression tests, benchmarks).
    # Leave as null (~ in YAML) for non-deterministic production use.
    rng_seed: ~
