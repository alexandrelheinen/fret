[project]
name = "fret"
version = "1.2.0"
description = "Full-stack Robotic Effector Trajectories Framework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "arco @ git+https://github.com/alexandrelheinen/arco.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
]
sim = [
    "mujoco>=3.10,<3.11",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
fretsim = "fret._cli:fretsim"
controller_node = "fret.control.controller_node:main"
straight_line_injector = "fret.ros.straight_line_injector:main"
arc_injector = "fret.ros.arc_injector:main"
scene_acquisition_node = "fret.scene.acquisition_node:main"
planner_node = "fret.planning.planner_node_ros:main"
perception_bridge = "fret.ros.perception_bridge:main"
mujoco_bridge = "fret.ros.mujoco_bridge:main"
dubins_race_node = "fret.ros.dubins_race_node:main"

[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fret" = ["config/**/*", "mjcf/**/*"]

[tool.black]
line-length = 79
target-version = ["py312"]
extend-exclude = """
/(build|install|log)/
"""

[tool.isort]
profile = "black"
line_length = 79
py_version = 39
skip_glob = ["build/*", "install/*", "log/*"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["build/", "install/", "log/", "src/fret.egg-info/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
