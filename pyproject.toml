[project]
name = "fret"
version = "1.4.4"
description = "Full-stack Robotic Effector Trajectories Framework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    # ARCO v0.5.0 runs its planners, maps and controllers as a compiled
    # Rust extension. The `mpc` extra is gone with CasADi, and the `arco`
    # name on PyPI belongs to an unrelated project, so pin the release
    # wheels by URL: they carry the abi3 extension and need no Rust
    # toolchain. A platform without a wheel below builds the sdist with
    # maturin, which does need one.
    "arco @ https://github.com/alexandrelheinen/arco/releases/download/v0.5.0/arco-0.5.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "arco @ https://github.com/alexandrelheinen/arco/releases/download/v0.5.0/arco-0.5.0-cp310-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "arco @ https://github.com/alexandrelheinen/arco/releases/download/v0.5.0/arco-0.5.0-cp310-abi3-win_amd64.whl ; sys_platform == 'win32'",
    "arco @ https://github.com/alexandrelheinen/arco/releases/download/v0.5.0/arco-0.5.0.tar.gz ; (sys_platform != 'linux' or platform_machine != 'x86_64') and (sys_platform != 'darwin' or platform_machine != 'arm64') and sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
]
vision = [
    # <4.12 keeps NumPy 1.26 (ROS Jazzy / Debian) installable in CI.
    # 4.12+ requires NumPy 2 and breaks apt-managed numpy uninstall.
    "opencv-python-headless>=4.10,<4.12",
]
sim = [
    "mujoco>=3.10,<3.11",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.10,<4.12",
]

[project.scripts]
fretsim = "fret._cli:fretsim"
controller_node = "fret.control.controller_node:main"
scene_acquisition_node = "fret.scene.acquisition_node:main"
planner_node = "fret.planning.planner_node_ros:main"
perception_bridge = "fret.ros.perception_bridge:main"
mujoco_bridge = "fret.ros.mujoco_bridge:main"
dubins_race_node = "fret.ros.dubins_race_node:main"

[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fret" = ["config/**/*", "mjcf/**/*"]
"fret.telemetry.layouts" = ["*.xml", "*.yaml", "README.md"]

[tool.black]
line-length = 79
target-version = ["py312"]
extend-exclude = """
/(build|install|log)/
"""

[tool.isort]
profile = "black"
line_length = 79
py_version = 39
skip_glob = ["build/*", "install/*", "log/*"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["build/", "install/", "log/", "src/fret.egg-info/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
