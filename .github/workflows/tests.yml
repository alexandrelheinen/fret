name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  unit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [control, planning, scene, simulation]
    container:
      image: osrf/ros:jazzy-desktop-noble
    env:
      ROS_DISTRO: jazzy

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/ros-build

      - name: Run unit test shard
        run: bash scripts/tests/unit_shard.sh "${{ matrix.shard }}"

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  unit-coverage:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install coverage
        run: python3 -m pip install --break-system-packages coverage

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage and enforce gate
        run: bash scripts/tests/unit_coverage.sh

  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: osrf/ros:jazzy-desktop-noble
    env:
      ROS_DISTRO: jazzy

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/ros-build

      - name: Run smoke tests
        run: bash scripts/tests/smoke.sh

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: osrf/ros:jazzy-desktop-noble
    env:
      ROS_DISTRO: jazzy

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/ros-build

      - name: Run integration tests
        run: bash scripts/tests/integration.sh

      - name: Upload physics contact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-contacts
          path: /tmp/fret_physics/**/*
          if-no-files-found: ignore
