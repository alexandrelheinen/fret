name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: osrf/ros:jazzy-desktop-noble
    env:
      ROS_DISTRO: jazzy

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CI tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb \
            python3-pip \
            curl \
            gnupg
          python3 -m pip install --break-system-packages \
            pytest pytest-cov pytest-timeout

      - name: Configure Gazebo apt repository
        run: |
          curl -sSL https://packages.osrfoundation.org/gazebo.gpg \
            | gpg --dearmor --yes -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable noble main" \
            > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update

      - name: Initialize rosdep
        run: |
          rosdep init 2>/dev/null || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          . /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: bash scripts/build.sh

      - name: Run unit tests
        run: bash scripts/tests/unit.sh

      - name: Run smoke tests
        run: bash scripts/tests/smoke.sh
