name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            xvfb \
            python3-matplotlib

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          ./scripts/build.sh

      - name: Run Python unit tests
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          python3 -m unittest discover tests -v

      - name: Quality gate validation
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          python3 scripts/validate_quality_gates.py

      - name: Generate trajectory plots
        if: success() || failure()
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          python3 scripts/plot_trajectories.py \
            --output-dir /tmp/trajectory_plots

      - name: Upload trajectory plots as artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-plots-${{ github.run_id }}
          path: /tmp/trajectory_plots/*.png
          retention-days: 30

      - name: Publish plots to ci-artifacts branch
        if: >
          (success() || failure()) &&
          github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/trajectory_plots
          git init .
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan ci-artifacts
          git add *.png
          git commit -m "ci: trajectory plots PR#${{ github.event.number }} @ ${{ github.sha }}"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin ci-artifacts

      - name: Post trajectory plots as PR comment
        if: >
          always() &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const repo  = context.repo;
            const prNum = context.issue.number;
            const sha   = context.payload.pull_request.head.sha;
            const sha7  = sha.slice(0, 7);

            // Images are force-pushed to ci-artifacts; include the commit SHA as a
            // query parameter so browsers/CDNs don't serve stale cached versions.
            const rawBase =
              `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/ci-artifacts`;
            const v = sha;

            const body = [
              `## 📊 Trajectory Plots — \`${sha7}\``,
              '',
              '| Scenario | Plot |',
              '|----------|------|',
              `| **easy** | ![easy](${rawBase}/trajectory_easy.png?v=${v}) |`,
              `| **medium** | ![medium](${rawBase}/trajectory_medium.png?v=${v}) |`,
              `| **hard** | ![hard](${rawBase}/trajectory_hard.png?v=${v}) |`,
              '',
              '_2-D joint-space proxy (q₀ × q₁) — red dots: obstacles,_',
              '_blue line: planned path, green ★: start, orange ★: goal._',
            ].join('\n');

            // Upsert: update existing bot comment or create a new one.
            const marker = '## 📊 Trajectory Plots';
            const { data: comments } = await github.rest.issues.listComments({
              ...repo,
              issue_number: prNum,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNum,
                body,
              });
            }

      - name: Launch smoke tests
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash

          run_smoke_test() {
            local test_name="$1"
            shift
            local log_file="/tmp/${test_name}.log"

            set +e
            timeout 20s "$@" >"${log_file}" 2>&1
            local exit_code=$?
            set -e

            if [[ "${exit_code}" -ne 0 && "${exit_code}" -ne 124 ]]; then
              echo "${test_name} failed with exit code ${exit_code}."
              cat "${log_file}"
              exit "${exit_code}"
            fi

            echo "${test_name} finished with acceptable exit code ${exit_code}."
            tail -n 40 "${log_file}" || true
          }

          run_smoke_test "view_launch" xvfb-run -a ros2 launch fret view.py model:=scara
          run_smoke_test "sim_launch" xvfb-run -a ros2 launch fret sim.py model:=scara
          run_smoke_test "arco_scenario_launch" xvfb-run -a ros2 launch fret arco_scenario.py
          run_smoke_test "sitl_launch" xvfb-run -a ros2 launch fret sitl.py