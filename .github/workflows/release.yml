name: Release

# Renders PPP + Dubins MuJoCo showcase MP4s (overview + follow POV each) on
# version tags, verifies pixels are non-blank, uploads to Cloudflare R2.
# Each scenario publishes independently — one render failure does not block
# the other from reaching R2.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag label for R2 path (e.g. v1.1.0). Used for manual runs."
        required: true
        default: "v1.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl

jobs:
  render-ppp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install render dependencies
        uses: ./.github/actions/release-render-setup

      - name: Render PPP warehouse showcase clips
        # Real-time ffmpeg post-process is mandatory (default; never pass --no-realtime-postprocess).
        run: |
          ./scripts/video.sh \
            --model ppp \
            --scenario ppp_warehouse \
            --all-cameras \
            --collision-backend mujoco \
            --planner-algorithm rrt_star \
            --full-duration \
            --kinematic-mode \
            --output-dir showcase_renders \
            --timing-json showcase_renders/ppp_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: Upload PPP showcase artifacts
        uses: actions/upload-artifact@v6
        with:
          name: showcase-ppp
          path: showcase_renders/
          if-no-files-found: error

  render-dubins:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install render dependencies
        uses: ./.github/actions/release-render-setup

      - name: Render Dubins race showcase clips
        # Real-time ffmpeg post-process is mandatory (default; never pass --no-realtime-postprocess).
        run: |
          ./scripts/video.sh \
            --model dubins \
            --scenario dubins_race \
            --all-cameras \
            --collision-backend mujoco \
            --planner-algorithm sst \
            --full-duration \
            --kinematic-mode \
            --output-dir showcase_renders \
            --timing-json showcase_renders/dubins_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: Upload Dubins showcase artifacts
        uses: actions/upload-artifact@v6
        with:
          name: showcase-dubins
          path: showcase_renders/
          if-no-files-found: error

  publish-ppp:
    needs: render-ppp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PPP showcase renders
        uses: actions/download-artifact@v4
        with:
          name: showcase-ppp
          path: showcase_renders

      - name: Upload PPP clips to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          ./scripts/release/upload_scenario_r2.sh ppp_warehouse ppp_warehouse.mp4

  publish-dubins:
    needs: render-dubins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Dubins showcase renders
        uses: actions/download-artifact@v4
        with:
          name: showcase-dubins
          path: showcase_renders

      - name: Upload Dubins clips to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          ./scripts/release/upload_scenario_r2.sh dubins_race dubins_race.mp4

  publish-meta:
    needs: [render-ppp, render-dubins]
    if: >-
      always() &&
      (needs.render-ppp.result == 'success' || needs.render-dubins.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PPP showcase renders
        if: needs.render-ppp.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: showcase-ppp
          path: showcase_renders

      - name: Download Dubins showcase renders
        if: needs.render-dubins.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: showcase-dubins
          path: showcase_renders

      - name: List rendered showcase files
        run: ls -la showcase_renders/ || true

      - name: Write release metadata
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/release/write_showcase_meta.py \
            --renders-dir showcase_renders \
            --output meta.json \
            --tag "${TAG}" \
            --repo "${{ github.repository }}" \
            --git-sha "${{ github.sha }}" \
            --workflow-run "${WORKFLOW_RUN}"

      - name: Upload GitHub artifacts (backup)
        uses: actions/upload-artifact@v6
        with:
          name: showcase-videos-${{ github.ref_name }}
          path: |
            showcase_renders/
            meta.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload metadata to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          python3 -m pip install --break-system-packages awscli
          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/releases/${TAG}/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json
          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/latest/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json
