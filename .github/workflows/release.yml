name: Release

# Renders PPP + Dubins MuJoCo showcase MP4s (overview + follow POV each) on
# version tags, verifies pixels are non-blank, uploads to Cloudflare R2.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag label for R2 path (e.g. v1.1.0). Used for manual runs."
        required: true
        default: "v1.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl

jobs:
  render-ppp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install render dependencies
        uses: ./.github/actions/release-render-setup

      - name: Render PPP warehouse showcase clips
        run: |
          ./scripts/video.sh \
            --model ppp \
            --scenario ppp_warehouse \
            --all-cameras \
            --collision-backend mujoco \
            --planner-algorithm rrt_star \
            --full-duration \
            --output-dir showcase_renders \
            --timing-json showcase_renders/ppp_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: Upload PPP showcase artifacts
        uses: actions/upload-artifact@v6
        with:
          name: showcase-ppp
          path: showcase_renders/
          if-no-files-found: error

  render-dubins:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install render dependencies
        uses: ./.github/actions/release-render-setup

      - name: Render Dubins race showcase clips
        run: |
          ./scripts/video.sh \
            --model dubins \
            --scenario dubins_race \
            --all-cameras \
            --collision-backend mujoco \
            --planner-algorithm sst \
            --full-duration \
            --output-dir showcase_renders \
            --timing-json showcase_renders/dubins_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: Upload Dubins showcase artifacts
        uses: actions/upload-artifact@v6
        with:
          name: showcase-dubins
          path: showcase_renders/
          if-no-files-found: error

  publish:
    needs: [render-ppp, render-dubins]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download showcase renders
        uses: actions/download-artifact@v4
        with:
          pattern: showcase-*
          merge-multiple: true
          path: .

      - name: List rendered showcase files
        run: ls -la showcase_renders/

      - name: Write release metadata
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/release/write_showcase_meta.py \
            --renders-dir showcase_renders \
            --output meta.json \
            --tag "${TAG}" \
            --repo "${{ github.repository }}" \
            --git-sha "${{ github.sha }}" \
            --workflow-run "${WORKFLOW_RUN}"

      - name: Upload GitHub artifacts (backup)
        uses: actions/upload-artifact@v6
        with:
          name: showcase-videos-${{ github.ref_name }}
          path: |
            showcase_renders/
            meta.json
          retention-days: 90

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          python3 -m pip install --break-system-packages awscli

          for mp4 in showcase_renders/*.mp4; do
            base="$(basename "${mp4}")"
            aws s3 cp "${mp4}" \
              "s3://${R2_BUCKET}/releases/${TAG}/${base}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type video/mp4
            aws s3 cp "${mp4}" \
              "s3://${R2_BUCKET}/latest/${base}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type video/mp4
          done

          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/releases/${TAG}/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json
          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/latest/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json

          # Backward-compatible primary pointers for README / download script.
          aws s3 cp showcase_renders/ppp_warehouse_overview.mp4 \
            "s3://${R2_BUCKET}/latest/ppp_warehouse.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4
          aws s3 cp showcase_renders/dubins_race_overview.mp4 \
            "s3://${R2_BUCKET}/latest/dubins_race.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4
