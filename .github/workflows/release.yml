name: Release

# Full validation suite run on every version tag push and on workflow_dispatch.
# All checks from push workflows (formatting, type_check, tests, integration_tests)
# must pass here as a prerequisite for any release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install all tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pytest \
            clang-format \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-launch-testing-ros \
            xvfb
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            black \
            isort \
            mypy \
            numpy \
            matplotlib \
            pyyaml \
            pytest-cov \
            pytest-timeout

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      # See docs/interfaces.md — ARCO Dependency Contract.
      # Replace the placeholder below with the correct ARCO repository URL.
      - name: Checkout ARCO
        run: |
          echo "ARCO checkout not yet configured — update this step with the ARCO repository URL."
          # Placeholder — replace with:
          # git clone <arco-url> ../arco

      - name: Install ARCO
        run: |
          if [ -d "../arco" ]; then
            python3 -m pip install -e ../arco/
            python3 -c "
from arco.mapping import KDTreeOccupancy
from arco.planning import SST, RRTStar, TrajectoryPruner, TrajectoryOptimizer
from arco.guidance import BSplineInterpolator
print('ARCO API surface OK')
"
          else
            echo "WARNING: ../arco/ not found. Tests requiring ARCO will fail."
          fi

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: bash scripts/build.sh

      - name: Check formatting
        run: bash scripts/check_formatting.sh

      - name: Check types
        run: bash scripts/check_types.sh

      - name: Run Milestone 1 simulation
        run: |
          python3 -m pip install -e src/fret --no-deps
          bash scripts/simulate_milestone1.sh

      - name: Run unit tests and quality gates
        run: bash scripts/run_tests.sh

      - name: Run integration tests
        run: bash scripts/run_integration_tests.sh

      - name: Run launch smoke tests
        run: bash scripts/run_smoke_tests.sh

