name: Release

# Full validation suite run on every version tag push and on workflow_dispatch.
# All checks from push workflows (formatting, type_check, tests, integration_tests)
# must pass here as a prerequisite for any release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install all tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pytest \
            clang-format \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-launch-testing-ros \
            xvfb
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            black \
            isort \
            mypy \
            numpy \
            pytest-cov \
            pytest-timeout

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      # See docs/interfaces.md — ARCO Dependency Contract.
      # Replace the placeholder below with the correct ARCO repository URL.
      - name: Checkout ARCO
        run: |
          echo "ARCO checkout not yet configured — update this step with the ARCO repository URL."
          # Placeholder — replace with:
          # git clone <arco-url> ../arco

      - name: Install ARCO
        run: |
          if [ -d "../arco" ]; then
            python3 -m pip install -e ../arco/
            python3 -c "
from arco.mapping import KDTreeOccupancy
from arco.planning import SST, RRTStar, TrajectoryPruner, TrajectoryOptimizer
from arco.guidance import BSplineInterpolator
print('ARCO API surface OK')
"
          else
            echo "WARNING: ../arco/ not found. Tests requiring ARCO will fail."
          fi

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          ./scripts/build.sh

      - name: Validate Python formatting
        run: |
          python3 -m black --check --target-version py312 --line-length 79 src/
          python3 -m isort --check-only --line-length 79 src/

      - name: Validate C++ formatting
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Type check
        run: |
          python3 -m mypy src/ \
            --ignore-missing-imports \
            --strict \
            --exclude 'src/fret\.egg-info'

      - name: Run unit tests with coverage gate
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          pytest tests/ -v \
            --ignore=tests/integration \
            --cov=src/fret \
            --cov-fail-under=90 \
            --timeout=60

      - name: Run integration tests
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          xvfb-run -a pytest tests/integration/ -v --timeout=120

      - name: Launch smoke tests
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash

          run_smoke_test() {
            local test_name="$1"
            shift
            local log_file="/tmp/${test_name}.log"
            set +e
            timeout 20s "$@" >"${log_file}" 2>&1
            local exit_code=$?
            set -e
            if [[ "${exit_code}" -ne 0 && "${exit_code}" -ne 124 ]]; then
              echo "${test_name} failed with exit code ${exit_code}."
              cat "${log_file}"
              exit "${exit_code}"
            fi
            echo "${test_name} passed (exit ${exit_code})."
            tail -n 20 "${log_file}" || true
          }

          run_smoke_test "view_launch" \
            xvfb-run -a ros2 launch fret view.py model:=scara
          run_smoke_test "sim_launch" \
            xvfb-run -a ros2 launch fret sim.py model:=scara
          run_smoke_test "sitl_static_reach" \
            xvfb-run -a ros2 launch fret sitl.py scenario:=static_reach model:=scara
