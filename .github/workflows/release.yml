name: Release

# Renders PPP + Dubins MuJoCo showcase MP4s (overview + follow POV each) on
# version tags, verifies pixels are non-blank, uploads to Cloudflare R2.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag label for R2 path (e.g. v1.1.0). Used for manual runs."
        required: true
        default: "v1.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  showcase-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install EGL/Mesa and Python render deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri \
            libosmesa6
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -e ".[sim]" awscli

      - name: Render PPP warehouse showcase clips
        run: |
          ./scripts/video.sh \
            --model ppp \
            --scenario ppp_warehouse \
            --all-cameras \
            --collision-backend mujoco \
            --planner-algorithm rrt_star \
            --no-tracking \
            --output-dir showcase_renders \
            --timing-json showcase_renders/ppp_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: Render Dubins race showcase clips
        run: |
          ./scripts/video.sh \
            --model dubins \
            --scenario dubins_race \
            --all-cameras \
            --output-dir showcase_renders \
            --timing-json showcase_renders/dubins_timing.json \
            --fps 30 \
            --width 1280 \
            --height 720

      - name: List rendered showcase files
        run: ls -la showcase_renders/

      - name: Write release metadata
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["TAG"]
          renders = sorted(Path("showcase_renders").glob("*.mp4"))
          if not renders:
              raise SystemExit("No showcase MP4 files were produced")

          expected = {
              "ppp_warehouse": {
                  "model": "ppp",
                  "timing_file": "ppp_timing.json",
                  "primary_video": "ppp_warehouse_overview.mp4",
              },
              "dubins_race": {
                  "model": "dubins",
                  "timing_file": "dubins_timing.json",
                  "primary_video": "dubins_race_overview.mp4",
              },
          }

          showcases = []
          for scenario, cfg in expected.items():
              prefix = f"{scenario}_"
              scenario_files = [p for p in renders if p.name.startswith(prefix)]
              if not scenario_files:
                  raise SystemExit(f"Missing showcase clips for {scenario}")

              timing_path = Path("showcase_renders") / cfg["timing_file"]
              if not timing_path.is_file():
                  raise SystemExit(f"Missing timing metadata: {timing_path}")
              timing_data = json.loads(timing_path.read_text(encoding="utf-8"))
              clip_timing = {
                  item["file"]: item for item in timing_data.get("clips", [])
              }

              videos = []
              duration_s = 0.0
              for path in sorted(scenario_files):
                  camera = path.stem.removeprefix(prefix)
                  timing = clip_timing.get(path.name, {})
                  sim_time_s = float(timing.get("sim_time_s", 0.0))
                  duration_s = max(duration_s, sim_time_s)
                  videos.append(
                      {
                          "camera": camera,
                          "file": path.name,
                          "bytes": path.stat().st_size,
                          "sim_time_s": sim_time_s,
                          "real_time_factor": float(
                              timing.get("real_time_factor", 1.0)
                          ),
                      }
                  )

              showcases.append(
                  {
                      "scenario": scenario,
                      "model": cfg["model"],
                      "duration_s": duration_s,
                      "realtime_playback": True,
                      "cameras": [video["camera"] for video in videos],
                      "videos": videos,
                      "primary_video": cfg["primary_video"],
                  }
              )

          meta = {
              "repo": "${{ github.repository }}",
              "git_sha": "${{ github.sha }}",
              "git_ref": tag,
              "release_cameras": ["overview", "follow"],
              "realtime_playback": True,
              "fps": 30,
              "width": 1280,
              "height": 720,
              "showcases": showcases,
              "primary_videos": {
                  item["scenario"]: item["primary_video"] for item in showcases
              },
              "rendered_at": datetime.now(timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          }
          Path("meta.json").write_text(
              json.dumps(meta, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(meta, indent=2))
          PY
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

      - name: Upload GitHub artifacts (backup)
        uses: actions/upload-artifact@v6
        with:
          name: showcase-videos-${{ github.ref_name }}
          path: |
            showcase_renders/
            meta.json
          retention-days: 90

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          for mp4 in showcase_renders/*.mp4; do
            base="$(basename "${mp4}")"
            aws s3 cp "${mp4}" \
              "s3://${R2_BUCKET}/releases/${TAG}/${base}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type video/mp4
            aws s3 cp "${mp4}" \
              "s3://${R2_BUCKET}/latest/${base}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type video/mp4
          done

          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/releases/${TAG}/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json
          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/latest/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json

          # Backward-compatible primary pointers for README / download script.
          aws s3 cp showcase_renders/ppp_warehouse_overview.mp4 \
            "s3://${R2_BUCKET}/latest/ppp_warehouse.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4
          aws s3 cp showcase_renders/dubins_race_overview.mp4 \
            "s3://${R2_BUCKET}/latest/dubins_race.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4
