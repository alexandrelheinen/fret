name: Release

# Renders the PPP warehouse MuJoCo showcase MP4 on version tags, verifies
# pixels are non-blank, uploads to Cloudflare R2, and keeps a GitHub artifact.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag label for R2 path (e.g. v0.2). Used for manual runs."
        required: true
        default: "v0.2"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  showcase-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MUJOCO_GL: egl
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, sim deps, and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
          python3 -m pip install --upgrade pip
          # Standalone render script only needs sim extras (not full editable
          # install with ARCO git dep). --break-system-packages for Ubuntu 24.04.
          python3 -m pip install --break-system-packages \
            mujoco imageio imageio-ffmpeg

      - name: Render PPP warehouse MP4
        run: |
          ./scripts/video.sh \
            --model ppp \
            --scenario ppp_warehouse \
            --duration 30 \
            --fps 30 \
            --width 1280 \
            --height 720 \
            -o ppp_warehouse_showcase.mp4
          test -s ppp_warehouse_showcase.mp4

      - name: Verify render is not blank
        run: |
          python3 - <<'PY'
          import imageio.v3 as iio

          frame = iio.imread("ppp_warehouse_showcase.mp4", index=0)
          mean = float(frame.mean())
          print(f"frame mean={mean}")
          if mean <= 1.0:
              raise SystemExit("Render looks blank (frame mean <= 1.0)")
          PY

      - name: Write release metadata
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          cat > meta.json <<EOF
          {
            "repo": "${{ github.repository }}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${TAG}",
            "scenario": "ppp_warehouse",
            "model": "ppp",
            "duration_s": 30,
            "fps": 30,
            "width": 1280,
            "height": 720,
            "rendered_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          aws s3 cp ppp_warehouse_showcase.mp4 \
            "s3://${R2_BUCKET}/releases/${TAG}/ppp_warehouse_showcase.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4

          aws s3 cp meta.json \
            "s3://${R2_BUCKET}/releases/${TAG}/meta.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json

          aws s3 cp ppp_warehouse_showcase.mp4 \
            "s3://${R2_BUCKET}/latest/ppp_warehouse.mp4" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type video/mp4

      - name: Upload GitHub artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ppp-warehouse-showcase-${{ github.ref_name }}
          path: ppp_warehouse_showcase.mp4
          retention-days: 90
