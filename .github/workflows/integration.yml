name: Integration Tests

# Validates Level 2 (architecture/pipeline) by running launch_testing scenarios
# as defined in docs/scenarios.md and docs/interfaces.md.
# These tests verify inter-node communication contracts, not unit behavior.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: osrf/ros:jazzy-desktop-noble
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CI tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb \
            python3-pytest \
            python3-pip \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-launch-testing-ros
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout

      - name: Initialize rosdep
        run: |
          rosdep init 2>/dev/null || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          . /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: bash scripts/build.sh

      - name: Run integration tests
        run: bash scripts/tests/integration.sh
