name: Arc Scenario (SC-05) Simulation

# Runs a pure-Python simulation of the arc scenario (SC-05):
#   arc_injector generates an arc trajectory via analytical IK → ControllerNode
#   Jacobian tracking.  No Gazebo or ROS runtime is required.
#
# Plot content:
#   Panel 1: Cartesian (x, y) arc — ideal, IK reference, and executed paths.
#   Panel 2: EE tracking error over time.
#   Panel 3: Joint variables (q1, q2, q3) over time — reference vs. executed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: arc-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy>=1.26" \
            "pyyaml>=6.0" \
            "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run Arc scenario simulation
        run: bash scripts/simulate_arc.sh --output /tmp/sim_output_arc

      - name: Upload arc plots as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: arc-trajectory-plots
          path: /tmp/sim_output_arc/arc_plots.png
          retention-days: 30

      - name: Post simulation results as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: bash scripts/post_arc_report.sh /tmp/sim_output_arc
