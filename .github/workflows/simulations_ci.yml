name: Simulations

# Single workflow that runs all milestone (MS-X) and scenario (SC-X)
# simulations as parallel jobs, then posts ONE combined results table to
# the PR.
#
# Jobs:
#   ms1  — MS-01 Straight-Line Tracking        (pure-Python, no ROS)
#   ms2  — MS-02 Planning Pipeline             (pure-Python, no ROS)
#   ms3  — MS-03 End-to-End Pipeline           (pure-Python, no ROS)
#   ms4  — MS-04 Workspace Occupancy           (pure-Python, no ROS)
#   ms5  — MS-05 Pillar Avoidance              (pure-Python, no ROS)
#   sc05 — SC-05 Arc Scenario                  (pure-Python, no ROS)
#   sc01 — SC-01 Static Reach                  (pure-Python, no ROS)
#   report — download all results.env artifacts, post single PR comment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: simulations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# ---------------------------------------------------------------------------
# Reusable Python setup step (used by all pure-Python jobs)
# ---------------------------------------------------------------------------

jobs:
  # =========================================================================
  # MS-01 — Straight-Line Tracking  (pure-Python)
  # =========================================================================
  ms1:
    name: "MS-01 | Straight-Line Tracking"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run MS-01 simulation
        run: bash scripts/simulate_milestone1.sh --output /tmp/sim_ms1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ms1
          path: /tmp/sim_ms1/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # MS-02 — Planning Pipeline  (pure-Python)
  # =========================================================================
  ms2:
    name: "MS-02 | Planning Pipeline"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run MS-02 simulation
        run: bash scripts/simulate_milestone2.sh --output /tmp/sim_ms2

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ms2
          path: /tmp/sim_ms2/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # MS-03 — End-to-End Pipeline  (pure-Python)
  # =========================================================================
  ms3:
    name: "MS-03 | End-to-End Pipeline"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run MS-03 simulation
        run: bash scripts/simulate_milestone3.sh --output /tmp/sim_ms3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ms3
          path: /tmp/sim_ms3/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # MS-04 — Workspace Occupancy  (pure-Python)
  # =========================================================================
  ms4:
    name: "MS-04 | Workspace Occupancy"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run MS-04 simulation
        run: bash scripts/simulate_milestone4.sh --output /tmp/sim_ms4

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ms4
          path: /tmp/sim_ms4/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # MS-05 — Pillar Avoidance  (pure-Python)
  # =========================================================================
  ms5:
    name: "MS-05 | Pillar Avoidance"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run MS-05 simulation
        run: bash scripts/simulate_milestone5.sh --output /tmp/sim_ms5

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ms5
          path: /tmp/sim_ms5/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # SC-05 — Arc Scenario  (pure-Python)
  # =========================================================================
  sc05:
    name: "SC-05 | Arc Scenario"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run SC-05 arc simulation
        run: bash scripts/simulate_arc.sh --output /tmp/sim_sc05

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-sc05
          path: /tmp/sim_sc05/results.env
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # SC-01 — Static Reach  (pure-Python, same pipeline as MS-03)
  # =========================================================================
  sc01:
    name: "SC-01 | Static Reach"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.26" "pyyaml>=6.0" "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run SC-01 static-reach simulation
        run: bash scripts/simulate_static_reach.sh --output /tmp/sim_sc01

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-sc01
          path: /tmp/sim_sc01/
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================
  # report — Post combined PR comment
  # =========================================================================
  report:
    name: "Post Combined Report"
    if: always() && (github.event_name == 'pull_request')
    needs: [ms1, ms2, ms3, ms4, ms5, sc05, sc01]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all results artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/sim_results
          pattern: "results-*"
          merge-multiple: false

      - name: Post combined simulation report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MS1_RESULT:  ${{ needs.ms1.result }}
          MS2_RESULT:  ${{ needs.ms2.result }}
          MS3_RESULT:  ${{ needs.ms3.result }}
          MS4_RESULT:  ${{ needs.ms4.result }}
          MS5_RESULT:  ${{ needs.ms5.result }}
          SC05_RESULT: ${{ needs.sc05.result }}
          SC01_RESULT: ${{ needs.sc01.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/post_simulations_report.sh /tmp/sim_results
