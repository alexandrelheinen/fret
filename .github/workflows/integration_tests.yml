name: Integration Tests

# Validates Level 2 (architecture/pipeline) by running launch_testing scenarios
# as defined in docs/scenarios.md and docs/interfaces.md.
# These tests verify inter-node communication contracts, not unit behavior.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pytest \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-launch-testing-ros \
            xvfb

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      # ARCO must be checked out at ../arco/ relative to the workspace root.
      # Update this step with the correct repository URL when ARCO is hosted.
      # See docs/interfaces.md — ARCO Dependency Contract.
      - name: Checkout ARCO
        run: |
          echo "ARCO checkout not yet configured — update this step with the ARCO repository URL."
          echo "Expected path: ../arco/ (one level above the fret workspace root)."
          # Placeholder — replace with:
          # git clone <arco-url> ../arco

      - name: Install ARCO
        run: |
          if [ -d "../arco" ]; then
            python3 -m pip install -e ../arco/
            python3 -c "
from arco.mapping import KDTreeOccupancy
from arco.planning import SST, RRTStar, TrajectoryPruner, TrajectoryOptimizer
from arco.guidance import BSplineInterpolator
print('ARCO API surface OK')
"
          else
            echo "WARNING: ../arco/ not found. Integration tests that require ARCO will fail."
          fi

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          ./scripts/build.sh

      - name: Run integration tests
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          xvfb-run -a pytest tests/integration/ -v --timeout=120
