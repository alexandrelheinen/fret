name: Milestone 1 — Straight-Line Simulation

# Runs a pure-Python 3-second simulation of the SCARA straight-line tracking
# scenario, generates trajectory diagnostic plots, and posts them as a PR
# comment.  No Gazebo or ROS runtime is required.
#
# Plot content:
#   Panel 1: Cartesian (x, y, z) trajectory — reference + executed (≈ straight line).
#   Panel 2: C-space (q1°, q2°, q3 m)       — reference + executed (nonlinear).
#   Panel 3: Joint variables over time       — q1(t), q2(t), q3(t).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone1-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy>=1.26" \
            "pyyaml>=6.0" \
            "matplotlib>=3.8"
          python3 -m pip install -e src/fret --no-deps

      - name: Run Milestone 1 simulation
        run: bash scripts/simulate_milestone1.sh --output /tmp/sim_output

      - name: Upload trajectory plots as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-trajectory-plots
          path: /tmp/sim_output/trajectory_plots.png
          retention-days: 30

      - name: Post simulation results as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: bash scripts/post_milestone1_report.sh /tmp/sim_output

