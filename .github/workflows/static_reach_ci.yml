name: Static Reach (SC-01) Full fretsim Simulation

# Runs a full ROS 2 + Gazebo simulation of the static-reach scenario (SC-01)
# using the `fretsim scenario:=static_reach` command.
#
# Unlike the pure-Python milestone simulations, this workflow:
#   - Builds the complete ROS 2 workspace (colcon).
#   - Launches Gazebo with the arco_scenario.sdf world.
#   - Exercises all FRET nodes: planner_node, controller_node,
#     scene_acquisition_node, perception_bridge_node.
#   - Runs for the full scenario duration (20 s) plus startup overhead.
#   - Parses the live ROS log to verify planning SUCCESS, trajectory load,
#     and absence of controller faults.
#   - Posts (or updates) a results table as a PR comment.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: static-reach-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-gazebo-ros \
            ros-jazzy-gazebo-ros-pkgs \
            ros-jazzy-joint-state-publisher \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-xacro \
            xvfb
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy>=1.26" \
            "pyyaml>=6.0" \
            "matplotlib>=3.8"

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: bash scripts/build.sh

      - name: Run full fretsim static-reach simulation
        run: bash scripts/simulate_static_reach.sh --output /tmp/sim_output_static_reach

      - name: Upload ROS launch log as artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: static-reach-ros-log
          path: /tmp/sim_output_static_reach/
          retention-days: 30

      - name: Post simulation results as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: bash scripts/post_static_reach_report.sh /tmp/sim_output_static_reach
