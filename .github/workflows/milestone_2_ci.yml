name: Milestone 2 — Planning Pipeline Simulation

# Runs a pure-Python simulation of the Milestone 2 ARCO planning pipeline
# (PlannerNode → CSpaceChecker → TrajectoryGenerator) for the static-reach
# scenario, generates planning diagnostic plots, and posts them as a PR
# comment.  No Gazebo or ROS runtime is required.
#
# Plot content:
#   Panel 1: Cartesian (x, y) EE path — start and goal markers.
#   Panel 2: C-space (q1°, q2°, q3 cm) — waypoint sequence.
#   Panel 3: EE position (x, y, z) over path index.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone2-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy>=1.26" \
            "pyyaml>=6.0" \
            "matplotlib>=3.8"
          python3 -m pip install -e . --no-deps

      - name: Run Milestone 2 planning simulation
        run: bash scripts/simulate_milestone2.sh --output /tmp/sim_output_m2

      - name: Upload planning plots as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-planning-plots
          path: /tmp/sim_output_m2/planning_plots.png
          retention-days: 30

      - name: Post simulation results as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: bash scripts/post_milestone2_report.sh /tmp/sim_output_m2
